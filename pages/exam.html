<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Exam | cpedle</title>
    <link rel="stylesheet" href="css/styles.css?v=exam-answers-2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <script src="js/data.js"></script>
    <script src="js/theme-toggle.js"></script>
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="new-nav">
        <div class="nav__content">
            <a href="index.html" class="nav-logo-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                <span>cpedle</span>
            </a>
            <div class="nav__control">
                <input type="checkbox" id="menu" class="sr-only" />
                <label for="menu">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span class="sr-only">Toggle Menu</span>
                </label>
            </div>
            <div class="nav__options" id="nav-options-bar">
                <button class="link" id="exit-exam" type="button">EXIT EXAM</button>
            </div>
        </div>
    </nav>

    <!-- FIXED THEME TOGGLE BUTTON -->
    <button aria-pressed="false" class="theme-toggle" id="theme-toggle" title="Toggle Theme" aria-label="Toggle dark/light mode">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" />
        </svg>
        <span class="sr-only">Toggle Theme</span>
    </button>

    <section class="section-padding container" style="max-width: 820px;">
        <div class="card">
            <!-- Header bar with Counter and Live Countdown -->
            <div class="card-ui-header" style="margin-bottom: 20px;">
                <span id="exam-counter" class="ui-counter" style="font-weight: 600;">Question 1 of 10</span>
                <span id="exam-timer" class="exam-timer" aria-live="polite">01:00:00</span>
            </div>

            <!-- Visual Progress Bar -->
            <div class="exam-progress-track">
                <div id="exam-progress" class="exam-progress-fill" style="width: 10%;"></div>
            </div>

            <!-- Question Content -->
            <div id="question-text" class="question-text" style="font-size: 1.05rem; line-height: 1.6; margin-top: 15px;">Loading question...</div>

            <!-- Options Form -->
            <div id="options-list" class="options-list" style="margin: 25px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px;">
                <!-- Generated dynamically by exam-demo.js -->
            </div>

            <!-- Bottom Controls -->
            <div class="exam-controls">
                <button id="btn-flag" type="button" class="flag-btn" title="Shortcut: Alt+F">🏳 Flag for Review</button>
                <div style="display: flex; gap: 12px;">
                    <button id="btn-prev" type="button" class="btn-outline-pill" title="Shortcut: Alt+P">Previous</button>
                    <button id="btn-next" type="button" class="btn-solid-pill" title="Shortcut: Alt+N">Next Question</button>
                </div>
            </div>
        </div>
    </section>

    <!-- UI Logic Scope -->
    <script src="js/exam-demo.js?v=exam-answers-2"></script>

    <!-- FOOTER -->
    <footer class="footer bg-white">
        <div class="container">
            <div class="footer-top">
                <div class="footer-col">
                    <a href="faq.html">FAQ & Help</a>
                    <a href="index.html#how-it-works">How It Works</a>
                    <a href="subjects.html">CpE Disciplines</a>
                </div>
                <div class="footer-col">
                    <a href="generator.html">Practice Exam</a>
                    <a href="exam-history.html">Score Reports</a>
                    <a href="remediation.html">Remediation Exams</a>
                </div>
            </div>
            <div class="footer-programs">
                <div class="trust-badges small">
                    <span class="trust-pill dark">All rights reserved © cpedle Computer Engineering Review</span>
                </div>
            </div>
            <hr class="footer-divider">
            <div class="footer-bottom">
                <svg class="mail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                info@cpedle.com
            </div>
        </div>
    </footer>
</body>
</html>
