<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Approvals | Admin | cpedle</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet"></noscript>
    <script src="js/data.js"></script>
    <script src="js/theme-toggle.js"></script>
    <style>
        .approvals-container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .approval-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 15px var(--shadow); }
        .approval-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: var(--navy); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .option-item { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
        .option-item.correct { border-color: var(--teal); background: rgba(46, 196, 182, 0.1); font-weight: 600; }
        .action-btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
    </style>
</head>
<body>
    <nav class="new-nav">
        <div class="nav__content">
            <a href="admin-dashboard.html" class="nav-logo-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                <span>cpedle</span>
            </a>
            <div class="nav__options" id="admin-nav-bar"></div>
        </div>
    </nav>

    <button aria-pressed="false" class="theme-toggle" id="theme-toggle" title="Toggle Theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1-.75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0Z"/></svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z"/></svg>
    </button>

    <div class="approvals-container">
        <h1 class="serif-heading" style="font-size: 2.2rem; margin-bottom: 20px;">Question Approval Queue</h1>
        <div id="approvals-list"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await enforceRoleGuard(['ADMIN']);
            renderSessionNavigation(document.getElementById('admin-nav-bar'), 'admin-question-approvals.html');
            loadApprovals();
        });

        async function loadApprovals() {
            const list = document.getElementById('approvals-list');
            try {
                const submissions = await apiCall('/questions/change-requests');
                if (!submissions.length) {
                    list.innerHTML = '<div class="approval-card"><p>No pending question submissions found.</p></div>';
                    return;
                }
                list.innerHTML = submissions.map(change => {
                    const q = change.question;
                    return `
                    <div class="approval-card" id="request-${change.id}">
                        <div class="approval-header">
                            <div>
                                <strong>${escapeHtml(change.action)} request</strong><br>
                                <strong>Domain:</strong> ${escapeHtml(q.domain)} |
                                <strong>Difficulty:</strong> ${escapeHtml(q.difficulty)} |
                                <strong>Cognitive:</strong> ${escapeHtml(q.cognitive)}
                            </div>
                            <span class="deficiency-tag tag-satisfactory">Submitted by ${escapeHtml(change.proposer || 'Examiner')}</span>
                        </div>
                        <div class="question-text">${escapeHtml(q.q)}</div>
                        ${change.action === 'DELETE' ? '<p>This approval will remove the question from the live bank.</p>' : ''}
                        <div class="options-grid">
                            ${(q.opts || []).map((opt, i) => `
                                <div class="option-item ${i === q.ans ? 'correct' : ''}">
                                    ${String.fromCharCode(65 + i)}. ${escapeHtml(opt)}${i === q.ans ? '✓' : ''}
                                </div>
                            `).join('')}
                        </div>
                        ${q.questionType === 'identification' || q.questionType === 'both'
                            ? `<p><strong>Accepted identification answer:</strong> ${escapeHtml(q.answerText || '—')}</p>` : ''}
                        ${q.explanation ? `<p><strong>Explanation:</strong> ${escapeHtml(q.explanation)}</p>` : ''}
                        <div class="action-btns">
                            <button class="btn-solid-pill coral-btn" onclick="decideQuestion(${change.id}, false)">Reject</button>
                            <button class="btn-solid-pill" onclick="decideQuestion(${change.id}, true)">Approve</button>
                        </div>
                    </div>
                `; }).join('');
            } catch (err) {
                list.innerHTML = `<div class="approval-card"><p style="color:var(--coral);">${escapeHtml(err.message)}</p></div>`;
            }
        }

        async function decideQuestion(id, approve) {
            const reason = approve ? '' : await requestRejectionReason();
            if (approve && !await confirmActionDialog({
                message: 'Are you sure you want to approve this question change?',
                confirmLabel: 'Yes, Approve'
            })) return;
            if (!approve && !reason) return;
            try {
                await apiCall(`/admin/questions/change-requests/${encodeURIComponent(id)}/decision`, {
                    method: 'POST', body: JSON.stringify({ approve, reason })
                });
                await loadApprovals();
            } catch (err) { alert(err.message); }
        }
    </script>
</body>
</html>
