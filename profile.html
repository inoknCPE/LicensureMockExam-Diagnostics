<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | cpedle</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <script src="js/data.js"></script>
    <script src="js/theme-toggle.js"></script>
</head>
<body>
    <!-- TOP NAVIGATION BAR -->
    <nav class="new-nav">
        <div class="nav__content">
            <a href="examinee-dashboard.html" class="nav-logo-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                <span>cpedle</span>
            </a>
            <div class="nav__control">
                <input type="checkbox" id="menu" class="sr-only" />
                <label for="menu">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span class="sr-only">Toggle Menu</span>
                </label>
            </div>
            <div class="nav__options" id="user-nav-options"></div>
        </div>
    </nav>

    <!-- FIXED THEME TOGGLE BUTTON -->
    <button aria-pressed="false" class="theme-toggle" id="theme-toggle" title="Toggle Theme" aria-label="Toggle dark/light mode">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1-.75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" />
        </svg>
        <span class="sr-only">Toggle Theme</span>
    </button>

    <!-- PROFILE FORM SECTION -->
    <main class="auth-wrapper">
        <div class="auth-card card" style="position: relative;">
            <h1 class="serif-heading" style="font-size: 2.2rem; text-align: center; margin-bottom: 8px;">Personalize Your Profile</h1>
            <p style="text-align: center; color: var(--gray-text); font-size: 0.9rem; margin-bottom: 24px;">Your role is assigned by the system or administrator. Choose your Computer Engineering discipline.</p>

            <form id="profile-form">
                <div class="form-group">
                    <label for="prof-name">Full name</label>
                    <input type="text" id="prof-name" required placeholder="Your full name">
                </div>

                <div class="form-group">
                    <label for="prof-role">Access role</label>
                    <input type="text" id="prof-role" readonly style="opacity: 0.7; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="prof-discipline">Discipline</label>
                    <select id="prof-discipline" required></select>
                </div>

                <button type="submit" class="btn-solid-pill" style="width: 100%; margin-top: 10px;">Save Profile</button>
            </form>

            <hr style="margin: 28px 0; border: 0; border-top: 1px solid var(--border);">

            <form id="email-form">
                <h2 class="serif-heading" style="font-size: 1.3rem; margin-bottom: 6px;">Sign-in email</h2>
                <p style="color: var(--gray-text); font-size: 0.85rem; margin-bottom: 16px;">Use the saved address below to log in. To correct it, confirm your current password.</p>

                <div class="form-group">
                    <label for="prof-email">Email address</label>
                    <input type="email" id="prof-email" required placeholder="user@example.com">
                </div>

                <div class="form-group">
                    <label for="prof-password">Current password</label>
                    <input type="password" id="prof-password" required placeholder="••••••••••••">
                </div>

                <button type="submit" class="btn-outline-pill" style="width: 100%; margin-top: 10px;">Update Email</button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer bg-white">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                All rights reserved © cpedle Computer Engineering Review
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await enforceRoleGuard(['STUDENT', 'EXAMINER', 'ADMIN']);
            renderSessionNavigation(document.getElementById('user-nav-options'), 'profile.html');

            const user = CpedleDB.getCurrentUser();
            
            // Populate Discipline Select Dropdown
            const discSelect = document.getElementById('prof-discipline');
            Object.keys(DISCIPLINES).forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                discSelect.appendChild(opt);
            });

            // Populate current values
            document.getElementById('prof-name').value = user.name || '';
            document.getElementById('prof-role').value = user.role || 'GUEST';
            document.getElementById('prof-email').value = user.email || '';
            if (user.discipline && DISCIPLINES[user.discipline]) {
                discSelect.value = user.discipline;
            }

            // Save profile details
            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('prof-name').value.trim();
                const discipline = discSelect.value;
                try {
                    await CpedleDB.saveProfile(name, discipline);
                    alert('Profile updated successfully!');
                    location.reload();
                } catch (err) {
                    alert(err.message);
                }
            });

            // Update email address
            document.getElementById('email-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('prof-email').value.trim();
                const password = document.getElementById('prof-password').value;
                try {
                    await CpedleDB.changeOwnEmail(email, password);
                    alert('Email updated successfully!');
                    location.reload();
                } catch (err) {
                    alert(err.message);
                }
            });
        });
    </script>
</body>
</html>
