<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Examiner Dashboard | cpedle</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/data.js"></script>
</head>
<body>
    <nav class="new-nav"><div class="nav__content">
        <a class="nav-logo-box" href="examiner-dashboard.html"><span>cpedle Examiner</span></a>
        <div class="nav__control">
            <input type="checkbox" id="menu" class="sr-only">
            <label for="menu"><span class="sr-only">Toggle Menu</span>
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
                </svg>
            </label>
        </div>
        <div class="nav__options" id="examiner-nav-bar">
            <a class="link" href="examiner-dashboard.html" aria-current="page">DASHBOARD</a>
            <a class="link" href="test-bank.html">QUESTION BANK</a>
            <a class="link" href="examiner-question-submissions.html">QUESTION SUBMISSIONS</a>
            <a class="link" href="profile.html">PROFILE</a>
            <button class="link" onclick="CpedleDB.logout()">LOGOUT</button>
        </div>
    </div></nav>
    <section class="section-padding container">
        <h1>Examiner Workspace</h1>
        <p id="examiner-greeting" style="color:var(--gray-text)"></p>
        <div class="card" style="margin-top:24px">
            <h2>Question Bank</h2>
            <p>Propose new questions and edits using the assigned Computer Engineering domains. An administrator must approve each change before it reaches the live bank.</p>
            <p id="question-count"></p>
            <a class="btn-solid-pill" href="test-bank.html">Submit Question Changes →</a>
        </div>
    </section>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await CpedleDB.ready;
            const user = CpedleDB.getCurrentUser();
            renderSessionNavigation(document.getElementById('examiner-nav-bar'), 'examiner-dashboard.html');
            document.getElementById('examiner-greeting').textContent =
                `${user.name || user.username} • ${user.professionalTitle || 'Examiner'}`;
            document.getElementById('question-count').textContent =
                `${CpedleDB.getQuestions().length} question(s) currently in the bank.`;
        });
    </script>
</body>
</html>
