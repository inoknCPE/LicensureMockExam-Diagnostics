<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | cpedle</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/data.js"></script>
    <script src="js/auth-ui.js"></script>
</head>
<body>
    <nav class="new-nav"><div class="nav__content">
        <a class="nav-logo-box" href="index.html"><span>cpedle</span></a>
        <div class="nav__options"><a class="link" href="login.html">BACK TO LOGIN</a></div>
    </div></nav>
    <div class="auth-wrapper"><div class="card auth-card">
        <h1>Request Password Reset</h1>
        <p class="text-center" style="color:var(--gray-text); margin-bottom:20px;">
            Enter your username or email and propose a new password. An administrator must approve it before you can log in.
        </p>
        <form id="reset-form">
            <div class="form-group"><label for="reset-identifier">Username or email</label>
                <input id="reset-identifier" type="text" required autocomplete="username"></div>
            <div class="form-group"><label for="reset-pass">New password
                <span class="password-help"><button type="button" class="password-help-trigger" aria-label="Password requirements">?</button>
                <span class="password-tooltip" role="tooltip"></span></span></label>
                <input id="reset-pass" type="password" minlength="8" maxlength="30" required autocomplete="new-password"></div>
            <div class="form-group"><label for="reset-confirm">Confirm new password</label>
                <input id="reset-confirm" type="password" minlength="8" maxlength="30" required autocomplete="new-password"></div>
            <label class="show-password"><input id="reset-show" type="checkbox"> Show passwords</label>
            <p id="reset-message" role="status" aria-live="polite"></p>
            <button id="reset-submit" class="btn-solid-pill" type="submit" disabled>Submit for Admin Review</button>
        </form>
        <div class="auth-links"><a href="login.html">Back to login</a></div>
    </div></div>
    <script>
        const identifier = document.getElementById('reset-identifier');
        const button = document.getElementById('reset-submit');
        setupPasswordForm({
            passwordId: 'reset-pass', confirmId: 'reset-confirm',
            showId: 'reset-show', buttonId: 'reset-submit'
        });
        function checkIdentifier() {
            const pass = document.getElementById('reset-pass');
            const confirm = document.getElementById('reset-confirm');
            const validPassword = PASSWORD_RULES.every(([, check]) => check(pass.value));
            button.disabled = !identifier.value.trim() || !validPassword ||
                !confirm.value || pass.value !== confirm.value;
        }
        [identifier, document.getElementById('reset-pass'), document.getElementById('reset-confirm')]
            .forEach(input => input.addEventListener('input', checkIdentifier));
        document.getElementById('reset-form').addEventListener('submit', async event => {
            event.preventDefault();
            const message = document.getElementById('reset-message');
            try {
                const result = await CpedleDB.requestPasswordReset(
                    identifier.value.trim(),
                    document.getElementById('reset-pass').value,
                    document.getElementById('reset-confirm').value
                );
                message.textContent = result.message;
                message.style.color = '#16803d';
            } catch (error) {
                message.textContent = error.message;
                message.style.color = '#c62828';
            }
        });
    </script>
</body>
</html>
