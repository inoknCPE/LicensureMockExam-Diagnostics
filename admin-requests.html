    <!-- FIXED THEME TOGGLE BUTTON -->
    <button aria-pressed="false" class="theme-toggle" id="theme-toggle" title="Toggle Theme" aria-label="Toggle dark/light mode">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
        </svg>

            <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" />
        </svg>
        <span class="sr-only">Toggle Theme</span>
    </button>

    <!-- MAIN CONTENT -->
    <main class="section-padding bg-cream" style="min-height: calc(100vh - 60px);">
        <div class="container">
            <!-- HEADER BLOCK -->
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; gap: 20px; flex-wrap: wrap;">
                <div>
                    <h1 class="serif-heading" style="font-size: 2.5rem; line-height: 1.1;">Mock Exam Request Review Queue</h1>
                    <p style="color: var(--gray-text); font-size: 0.95rem; margin-top: 6px;">Review examinee test set suggestions. Approved requests can be immediately turned into mock exams.</p>
                </div>
                <div>
                    <select id="status-filter" onchange="renderRequests()" style="padding: 10px 18px; border: 1px solid var(--border); border-radius: 50px; background: var(--surface); color: var(--text); font-weight: 600;">
                        <option value="PENDING">Pending Review</option>
                        <option value="APPROVED">Approved</option>
                        <option value="REJECTED">Rejected</option>
                        <option value="All">All Requests</option>
                    </select>
                </div>
            </div>

            <!-- REQUESTS LIST -->
            <div id="requests-container" style="display: flex; flex-direction: column; gap: 16px;">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer bg-white">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                All rights reserved © cpedle Computer Engineering Review • Administrator Portal
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await enforceRoleGuard(['ADMIN']);
            renderRequests();
        });

        function renderRequests() {
            const container = document.getElementById('requests-container');
            const filter = document.getElementById('status-filter').value;
            const requests = CpedleDB.getRequests().filter(r => filter === 'All' || r.status === filter);

            container.innerHTML = '';
            if (requests.length === 0) {
                container.innerHTML = `<div class="step-card" style="padding: 30px; text-align: center; color: var(--gray-text);">No requests found under filter: <strong>${escapeHtml(filter)}</strong>.</div>`;
                return;
            }

            requests.forEach(req => {
                const card = document.createElement('div');
                card.className = 'step-card';
                card.style.padding = '24px';
                const tagClass = req.status === 'APPROVED' ? 'tag-proficient' : req.status === 'REJECTED' ? 'tag-deficient' : 'tag-satisfactory';

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
                        <div>
                            <span style="font-size:0.8rem; font-weight:700; color:var(--teal);">${escapeHtml(req.id || 'REQ')}</span>
                            <h3 style="font-size:1.3rem; color:var(--navy); margin:2px 0;">${escapeHtml(req.title)}</h3>
                            <div style="font-size:0.85rem; color:var(--gray-text);">Requested by: <strong>${escapeHtml(req.requestedBy || req.user || 'Examinee')}</strong> • Domain: ${escapeHtml(req.domain)}</div>
                        </div>
                        <span class="deficiency-tag ${tagClass}">${escapeHtml(req.status)}</span>
                    </div>
                    <p style="font-size:0.9rem; color:var(--text); margin-bottom:16px;">${escapeHtml(req.notes || 'No additional details provided.')}</p>
                    ${req.status === 'PENDING' ? `
                        <div style="display:flex; gap:10px; border-top:1px solid var(--border); padding-top:16px; justify-content:flex-end;">
                            <button class="btn-outline-pill" style="color:var(--coral); border-color:var(--coral);" onclick="updateStatus('${req.id}', 'REJECTED')">Reject Request</button>
                            <button class="btn-solid-pill" onclick="updateStatus('${req.id}', 'APPROVED')">Approve Request</button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        async function updateStatus(id, status) {
            const comment = prompt(`Add an optional comment for status: ${status}`) || '';
            try {
                await CpedleDB.updateRequestStatus(id, status, comment);
                renderRequests();
            } catch (err) {
                alert('Could not update request: ' + err.message);
            }
        }
    </script>
</body>
</html>
